# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
# lifehud.exe installs itself per user when run with --install (see src/platform/install.rs) and
# registers the "LifeHUD" entry in Settings > Apps, which winget uses to track and uninstall it.
PackageIdentifier: GeorgeAPI.LifeHUD
PackageVersion: 1.0.0
InstallerType: exe
Scope: user
InstallModes:
  - silent
  - silentWithProgress
InstallerSwitches:
  Silent: --install
  SilentWithProgress: --install
UpgradeBehavior: install
ProductCode: LifeHUD
MinimumOSVersion: 10.0.19041.0
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/George-API/LifeHUD/releases/download/v1.0.0/lifehud.exe
    InstallerSha256: REPLACE_WITH_SHA256_FROM_THE_RELEASE
AppsAndFeaturesEntries:
  - DisplayName: Life HUD
    ProductCode: LifeHUD
ManifestType: installer
ManifestVersion: 1.10.0
