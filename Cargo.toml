[package]
name = "lifehud"
version = "0.1.0"
edition = "2024"
description = "A calm, native Windows 11 desktop HUD: weather, time, tasks, notes, news and music."
license = "MIT"
readme = "README.md"
keywords = ["windows", "desktop", "widgets", "hud", "slint"]
categories = ["gui"]
publish = false

[dependencies]
quick-xml = "0.42.0"
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "raw-window-handle-06"] }
ureq = { version = "3.5.2", default-features = false, features = ["native-tls"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Security", "Win32_System_SystemInformation", "Win32_UI_Controls", "Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Graphics_Imaging", "Devices_Geolocation", "UI_ViewManagement", "UI", "Win32_Globalization"] }

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
